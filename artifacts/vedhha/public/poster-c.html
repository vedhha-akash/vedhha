<!DOCTYPE html>
<html><head><meta charset="UTF-8"/>
<style>* { margin:0; padding:0; box-sizing:border-box; } body { width:600px; font-family:'Arial Black',Arial,sans-serif; }</style>
</head><body>
<div style="width:600px;background:#111;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="background:#8b1a1a;padding:10px 20px;display:flex;justify-content:space-between;position:relative;z-index:2">
    <span style="font-size:11px;font-weight:900;letter-spacing:4px;color:#fff">🔥 VEDHHA DROP 2026</span>
    <span style="font-size:11px;font-weight:900;color:#c9a84c;letter-spacing:2px">MUMBAI</span>
  </div>
  <div style="padding:20px 20px 10px;position:relative;z-index:2">
    <div style="font-size:9px;letter-spacing:6px;color:#8b1a1a;font-weight:900;margin-bottom:4px">THE EKLAVYA WEAR</div>
    <div style="font-size:106px;font-weight:900;color:#fff;letter-spacing:10px;line-height:0.85;text-shadow:4px 4px 0 #8b1a1a,8px 8px 0 rgba(201,168,76,0.3)">VED<span style="color:#c9a84c">H</span>HA</div>
    <div style="font-size:12px;font-style:italic;font-weight:900;letter-spacing:8px;color:#c9a84c;margin-top:6px">EKLAVYA WARRIOR COLLECTION</div>
  </div>
  <div style="position:relative;height:280px;overflow:hidden;z-index:2">
    <img src="/simple-things-dual.jpg" style="width:100%;height:100%;object-fit:cover;object-position:top center;filter:contrast(1.1)"/>
    <div style="position:absolute;inset:0;background:linear-gradient(transparent 40%,#111)"></div>
    <div style="position:absolute;top:14px;right:14px;background:#c9a84c;padding:6px 14px;transform:rotate(3deg)">
      <div style="font-size:8px;font-weight:900;color:#000;letter-spacing:2px">STARTING AT</div>
      <div style="font-size:22px;font-weight:900;color:#000;line-height:1">₹399</div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;z-index:2">
    <div style="position:relative;background:#222;overflow:hidden;aspect-ratio:3/4">
      <img src="/life-is-beautiful-back.png" style="width:100%;height:100%;object-fit:cover;object-position:top"/>
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.88);padding:6px 8px">
        <div style="font-size:8px;font-weight:900;color:#fff;letter-spacing:0.5px">LIFE IS BEAUTIFUL</div>
        <div style="font-size:11px;color:#c9a84c;font-weight:900">₹599</div>
      </div>
    </div>
    <div style="position:relative;background:#222;overflow:hidden;aspect-ratio:3/4">
      <img src="/products/genz/muscles-tee-front.png" style="width:100%;height:100%;object-fit:cover;object-position:top"/>
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.88);padding:6px 8px">
        <div style="font-size:8px;font-weight:900;color:#fff">LIGHT WEIGHT BABY</div>
        <div style="font-size:11px;color:#c9a84c;font-weight:900">₹399</div>
      </div>
    </div>
    <div style="position:relative;background:#222;overflow:hidden;aspect-ratio:3/4">
      <img src="/products/genz/never-rival-tee-front.png" style="width:100%;height:100%;object-fit:cover;object-position:top"/>
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.88);padding:6px 8px">
        <div style="font-size:8px;font-weight:900;color:#fff">NEVER BE MY RIVAL</div>
        <div style="font-size:11px;color:#c9a84c;font-weight:900">₹599</div>
      </div>
    </div>
  </div>
  <div style="background:#c9a84c;padding:8px 20px;display:flex;justify-content:space-around;z-index:2;margin-top:3px">
    <span style="font-size:9px;font-weight:900;color:#000;letter-spacing:1px">🇮🇳 MADE IN INDIA</span>
    <span style="font-size:9px;font-weight:900;color:#000;letter-spacing:1px">FREE DELIVERY</span>
    <span style="font-size:9px;font-weight:900;color:#000;letter-spacing:1px">COD AVAILABLE</span>
    <span style="font-size:9px;font-weight:900;color:#000;letter-spacing:1px">EASY RETURNS</span>
  </div>
  <div style="background:#0a0a0a;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:2">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:70px;height:70px;background:#fff;padding:4px;border:2px solid #c9a84c"><img src="/vedhha-qr.png" style="width:100%;height:100%"/></div>
      <div>
        <div style="font-size:8px;letter-spacing:3px;color:#8b1a1a;font-weight:900">SCAN & ORDER NOW</div>
        <div style="font-size:26px;font-weight:900;color:#fff;letter-spacing:3px;line-height:1;text-shadow:2px 2px 0 #8b1a1a">VEDHHA.COM</div>
        <div style="font-size:8px;color:rgba(255,255,255,0.4);letter-spacing:1px">FAST DELIVERY ACROSS INDIA</div>
      </div>
    </div>
    <div style="background:#8b1a1a;padding:10px 16px;text-align:center">
      <div style="font-size:10px;font-weight:900;color:#fff;letter-spacing:2px">ORDER</div>
      <div style="font-size:10px;font-weight:900;color:#c9a84c;letter-spacing:2px">TODAY</div>
    </div>
  </div>
</div>
</body></html>
