<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 600px;
    height: 700px;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap {
    width: 340px;
    height: 290px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .icon-wrap img {
    position: absolute;
    width: 600px;
    top: -30px;
    left: -115px;
  }
  .divider {
    width: 260px;
    height: 1.5px;
    background: linear-gradient(to right, transparent, #c8832a, transparent);
    margin: 20px 0 22px;
    flex-shrink: 0;
  }
  .brand {
    font-family: 'Teko', sans-serif;
    font-size: 80px;
    font-weight: 700;
    letter-spacing: 20px;
    color: #111111;
    text-transform: uppercase;
    line-height: 1;
    flex-shrink: 0;
  }
  .tagline {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 7px;
    color: #c8832a;
    margin-top: 14px;
    text-transform: uppercase;
    font-weight: 400;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="icon-wrap">
    <img src="/original-logo-ref.jpg" />
  </div>
  <div class="divider"></div>
  <div class="brand">VEDHHA</div>
  <div class="tagline">The Eklavya Wear</div>
</body>
</html>
