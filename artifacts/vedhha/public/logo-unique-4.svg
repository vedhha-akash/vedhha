<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="200" fill="#0a0a0a"/>
  <!-- Circle split - half black half gold -->
  <circle cx="70" cy="100" r="52" fill="#c8832a"/>
  <clipPath id="left-half">
    <rect x="18" y="48" width="52" height="104"/>
  </clipPath>
  <circle cx="70" cy="100" r="52" fill="#0a0a0a" clip-path="url(#left-half)"/>
  <!-- V mark centered -->
  <text x="70" y="108" font-family="Arial Black, sans-serif" font-size="50" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">V</text>
  <!-- Wordmark -->
  <text x="300" y="94" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" letter-spacing="8">VEDHHA</text>
  <text x="300" y="128" font-family="Arial, sans-serif" font-size="10" fill="#c8832a" text-anchor="middle" letter-spacing="9">THE EKLAVYA WEAR</text>
</svg>
