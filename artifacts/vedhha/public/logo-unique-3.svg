<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="200" fill="white"/>
  <!-- Square rotated 45 = diamond -->
  <rect x="70" y="45" width="78" height="78" rx="4" fill="#c8832a" transform="rotate(45 109 84)"/>
  <!-- E letter inside for Eklavya -->
  <text x="70" y="100" font-family="Arial Black, sans-serif" font-size="44" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">E</text>
  <!-- Wordmark right -->
  <text x="300" y="88" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#0a0a0a" text-anchor="middle" letter-spacing="6">VEDHHA</text>
  <text x="300" y="120" font-family="Arial, sans-serif" font-size="10.5" fill="#888" text-anchor="middle" letter-spacing="8">THE EKLAVYA WEAR</text>
</svg>
